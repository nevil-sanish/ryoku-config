# Ryoku palette -> tmux. Rendered by matugen; do not edit.

set -g status-bg                          "#0b0e12"
set -gq @thm_bar_bg                       "#0b0e12"

set -gq @thm_bg                           "#101418"
set -gq @thm_fg                           "#e0e2e8"
set -gq @thm_primary                      "#9dcbfc"
set -gq @thm_inverse_primary              "#32628d"
set -gq @thm_surface_low                  "#191c20"
