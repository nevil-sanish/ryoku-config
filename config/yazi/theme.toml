# Ryoku palette for yazi. Rendered by the theme daemon; do not edit.
#
# yazi reads theme.toml beside yazi.toml. Ryoku ships only yazi.toml, so this
# file is the daemon's alone and clobbers nothing you wrote.

[mgr]
cwd = { fg = "#bac8da" }

hovered = { fg = "#cfe4ff", bg = "#134a74" }
preview_hovered = { underline = true }

find_keyword = { fg = "#d4bee5", bold = true }
find_position = { fg = "#bac8da", bold = true }

marker_copied = { fg = "#d4bee5", bg = "#d4bee5" }
marker_cut = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_marked = { fg = "#bac8da", bg = "#bac8da" }
marker_selected = { fg = "#9dcbfc", bg = "#9dcbfc" }

tab_active = { fg = "#003355", bg = "#9dcbfc" }
tab_inactive = { fg = "#c2c7cf", bg = "#1d2024" }

border_symbol = "│"
border_style = { fg = "#42474e" }

[mode]
normal_main = { fg = "#003355", bg = "#9dcbfc", bold = true }
normal_alt = { fg = "#9dcbfc", bg = "#1d2024" }
select_main = { fg = "#392a49", bg = "#d4bee5", bold = true }
select_alt = { fg = "#d4bee5", bg = "#1d2024" }
unset_main = { fg = "#690005", bg = "#ffb4ab", bold = true }
unset_alt = { fg = "#ffb4ab", bg = "#1d2024" }

[status]
progress_label = { fg = "#e0e2e8", bold = true }
progress_normal = { fg = "#9dcbfc", bg = "#1d2024" }
progress_error = { fg = "#ffb4ab", bg = "#1d2024" }

[input]
border = { fg = "#9dcbfc" }
title = {}
value = {}
selected = { reversed = true }

[pick]
border = { fg = "#9dcbfc" }
active = { fg = "#d4bee5", bold = true }
inactive = {}

[cmp]
border = { fg = "#9dcbfc" }
active = { fg = "#d4bee5", bold = true }
inactive = {}

[tasks]
border = { fg = "#9dcbfc" }
title = {}
hovered = { fg = "#d4bee5", underline = true }

[which]
mask = { bg = "#1d2024" }
cand = { fg = "#bac8da" }
rest = { fg = "#c2c7cf" }
desc = { fg = "#d4bee5" }
separator = "  "
separator_style = { fg = "#8c9199" }

[help]
on = { fg = "#bac8da" }
run = { fg = "#d4bee5" }
hovered = { reversed = true, bold = true }
footer = { fg = "#e0e2e8", bg = "#1d2024" }

[notify]
title_info = { fg = "#9dcbfc" }
title_warn = { fg = "#d4bee5" }
title_error = { fg = "#ffb4ab" }

# the file list itself: dirs and file kinds carry the palette so yazi matches
# kitty's ANSI colours (base16), not yazi's built-in defaults. First match wins,
# so the "*" fallback stays last.
[filetype]
rules = [
	{ mime = "image/*", fg = "#d4bee5" },
	{ mime = "{audio,video}/*", fg = "#9dcbfc" },
	{ mime = "application/{zip,gzip,x-tar,x-bzip2,x-7z-compressed,x-rar,vnd.rar,x-xz,zstd}", fg = "#9dcbfc" },
	{ url = "*", is = "orphan", fg = "#ffb4ab" },
	{ url = "*", is = "exec", fg = "#d4bee5" },
	{ url = "*/", fg = "#bac8da", bold = true },
	{ url = "*", fg = "#e0e2e8" },
]
